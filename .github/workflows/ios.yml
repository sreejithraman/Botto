name: iOS

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    # Public repositories run automatically; private repositories support manual dispatch.
    if: github.event.repository.private == false || github.event_name == 'workflow_dispatch'
    runs-on: xcode-27
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
          python3 --version
      - name: Runner resources before checks
        continue-on-error: true
        run: |
          sysctl hw.ncpu hw.memsize vm.swapusage
          vm_stat
      - name: Core, tooling, and native tests
        id: checks
        run: ./scripts/check-ci.sh
      - name: Runner resources after checks
        if: always()
        continue-on-error: true
        run: |
          sysctl hw.ncpu hw.memsize vm.swapusage
          vm_stat
      - name: Save native test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ios-test-results-${{ github.run_attempt }}
          path: |
            .artifacts/CIResults-*.xcresult
            ${{ steps.checks.outputs.native_result_fallback }}
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
