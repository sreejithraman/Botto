name: iOS

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    # Public repositories run automatically; private repositories support manual dispatch.
    if: github.event.repository.private == false || github.event_name == 'workflow_dispatch'
    runs-on: xcode-27
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
          python3 --version
      - name: Core, tooling, and native tests
        id: checks
        run: |
          device_id=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          print(next(device["udid"] for devices in json.load(sys.stdin)["devices"].values()
                     for device in devices if device.get("isAvailable") and "iPhone" in device["name"]))
          ')
          diagnostics=$(mktemp -d "$RUNNER_TEMP/botto-native-diagnostics.XXXXXX")
          echo "BOTTO_NATIVE_DIAGNOSTICS=$diagnostics" >> "$GITHUB_ENV"
          BOTTO_TEST_DESTINATION="platform=iOS Simulator,id=$device_id" \
            python3 scripts/native-test-diagnostics.py --device "$device_id" \
              --output-dir "$diagnostics" -- ./scripts/check-ci.sh
      - name: Save native test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ios-test-results-${{ github.run_attempt }}
          path: |
            .artifacts/CIResults-*.xcresult
            ${{ steps.checks.outputs.native_result_fallback }}
            ${{ env.BOTTO_NATIVE_DIAGNOSTICS }}
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
