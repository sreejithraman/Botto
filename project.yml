name: Botto
configs:
  Debug: debug
  Internal: release
  Release: release
options:
  bundleIdPrefix: com.sree
  deploymentTarget:
    iOS: "18.0"
    macOS: "15.0"
  createIntermediateGroups: true
  postGenCommand: python3 scripts/normalize-project.py
  xcodeVersion: "27.0"
packages:
  BottoCore:
    path: .
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: complete
    CLANG_ANALYZER_LOCALIZABILITY_NONLOCALIZED: YES
    BOTTO_APP_BUNDLE_IDENTIFIER: com.sree.botto
    BOTTO_PUSH_KEYCHAIN_GROUP: "$(AppIdentifierPrefix)$(BOTTO_APP_BUNDLE_IDENTIFIER).push"
  configs:
    Debug:
      BOTTO_APNS_ENVIRONMENT: development
      BOTTO_PUSH_ENVIRONMENT: sandbox
    Internal:
      BOTTO_APNS_ENVIRONMENT: production
      BOTTO_PUSH_ENVIRONMENT: production
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) BOTTO_INTERNAL_TOOLS"
    Release:
      BOTTO_APNS_ENVIRONMENT: production
      BOTTO_PUSH_ENVIRONMENT: production
targets:
  Botto:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes: [Resources/Info.plist, NotificationService, "**/*.entitlements", "**/AGENTS.md"]
      - path: LICENSES
        buildPhase: resources
      - path: LICENSE
        buildPhase: resources
      - path: THIRD_PARTY_NOTICES.md
        buildPhase: resources
    dependencies:
      - package: BottoCore
      - target: BottoNotifications
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "$(BOTTO_APP_BUNDLE_IDENTIFIER)"
        CODE_SIGN_ENTITLEMENTS: App/Push/Botto.entitlements
        PROVISIONING_PROFILE_SPECIFIER: "$(BOTTO_APP_PROVISIONING_PROFILE_SPECIFIER)"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: App/Resources/Info.plist
        SUPPORTS_MACCATALYST: NO
  BottoNotifications:
    type: app-extension
    platform: iOS
    sources:
      - path: App/NotificationService
        excludes: [Info.plist, "*.entitlements"]
      - path: App/Push/PushPairingVault.swift
    dependencies:
      - package: BottoCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "$(BOTTO_APP_BUNDLE_IDENTIFIER).notifications"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: App/NotificationService/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/NotificationService/BottoNotifications.entitlements
        PROVISIONING_PROFILE_SPECIFIER: "$(BOTTO_NOTIFICATIONS_PROVISIONING_PROFILE_SPECIFIER)"
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
  BottoTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: AppTests
      - path: Tests/BottoCoreTests/MessagePresentationPerformanceTests.swift
    dependencies:
      - target: Botto
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "$(BOTTO_APP_BUNDLE_IDENTIFIER).tests"
        GENERATE_INFOPLIST_FILE: YES
  BottoUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: AppUITests
    info:
      path: AppUITests/Info.plist
      properties:
        BottoBuildConfiguration: "$(CONFIGURATION)"
    dependencies:
      - target: Botto
      - package: BottoCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "$(BOTTO_APP_BUNDLE_IDENTIFIER).uitests"
        GENERATE_INFOPLIST_FILE: NO
  BottoMac:
    type: application
    platform: macOS
    sources: [Mac]
    dependencies:
      - package: BottoCore
    postBuildScripts:
      - name: Embed T3 Engine
        basedOnDependencyAnalysis: false
        script: |
          case " $ARCHS " in
            *" arm64 "*)
              "$SRCROOT/scripts/bundle-t3-engine.sh" \
                --embed "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH"
              ;;
          esac
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "$(BOTTO_APP_BUNDLE_IDENTIFIER).mac"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Botto
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: Botto uses the local network to connect to its T3 server and pair phones.
        ENABLE_APP_SANDBOX: NO
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
  BottoMacTests:
    type: bundle.unit-test
    platform: macOS
    sources: [MacTests]
    dependencies:
      - target: BottoMac
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "$(BOTTO_APP_BUNDLE_IDENTIFIER).mac.tests"
        GENERATE_INFOPLIST_FILE: YES
schemes:
  BottoMac:
    build:
      targets:
        BottoMac: all
        BottoMacTests: [test]
    test:
      targets: [BottoMacTests]
  Botto:
    build:
      targets:
        Botto: all
        BottoTests: [test]
        BottoUITests: [test]
    test:
      targets: [BottoTests, BottoUITests]
      gatherCoverageData: true
  Botto Internal:
    build:
      targets:
        Botto: all
        BottoUITests: [test]
    run:
      config: Internal
    test:
      config: Internal
      targets:
        - name: BottoUITests
          selectedTests: [DeveloperToolsUITests]
    profile:
      config: Internal
    analyze:
      config: Internal
    archive:
      config: Internal
